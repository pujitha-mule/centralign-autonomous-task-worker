services:
  - type: web
    name: centralign-task-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz

    envVars:
      - key: LLM_PROVIDER
        value: openai

      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1

      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      - key: OPENAI_API_KEY
        sync: false

      - key: INTERNAL_API_URL
        value: http://127.0.0.1:8000

      - key: MAX_STEPS
        value: "15"

      - key: FAIL_ONCE_ID
        value: ""

      - key: FAIL_RATE
        value: "0"